name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm run test --if-present
        env:
          CI: true

      - name: Build
        run: npm run build --if-present

  security:
    name: Security & Dependency Audit
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies (CI)
        run: npm ci

      - name: Audit npm dependencies (fail on critical+)
        run: |
          npm audit --audit-level=critical
        env:
          CI: true

      - name: Export audit metrics (always)
        if: always()
        run: |
          # run audit and save JSON even if it reports vulnerabilities
          npm audit --json > audit.json || true

          # ensure jq is available; install if missing
          if ! command -v jq >/dev/null 2>&1; then
            echo "jq not found, installing..."
            sudo apt-get update -y && sudo apt-get install -y jq
          fi

          critical=$(jq -r '.metadata.vulnerabilities.critical // 0' audit.json)
          high=$(jq -r '.metadata.vulnerabilities.high // 0' audit.json)
          moderate=$(jq -r '.metadata.vulnerabilities.moderate // 0' audit.json)
          low=$(jq -r '.metadata.vulnerabilities.low // 0' audit.json)

          # write summary using printf to avoid YAML parsing issues with pipe characters
          printf '%s\n' \
            '| Severity | Count |' \
            '|---:|---:|' \
            "| Critical | ${critical} |" \
            "| High | ${high} |" \
            "| Moderate | ${moderate} |" \
            "| Low | ${low} |" \
            > audit_summary.md

          echo "Audit summary:" && cat audit_summary.md

      - name: Upload audit summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-summary
          path: |
            audit.json
            audit_summary.md
